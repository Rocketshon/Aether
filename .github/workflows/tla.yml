name: TLA+ Model Check
on:
  push:
    paths: ["**/formal/**"]
  pull_request:
    paths: ["**/formal/**"]

jobs:
  model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TLC
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -O /tmp/tla2tools.jar
      - name: Run TLC model checker
        run: |
          cd aether-ref/formal
          java -cp /tmp/tla2tools.jar tlc2.TLC AetherSpec.tla -config AetherSpec.cfg -workers auto
