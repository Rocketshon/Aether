version: "3.8"
services:
  aether-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./adapter-config.yaml:/etc/aether/adapter-config.yaml:ro
      - ./sample-policy.yaml:/etc/aether/policy.yaml:ro
    cap_add:
      - NET_ADMIN
    command:
      - serve
      - --bind
      - "0.0.0.0:8080"
      - --audit-key-hex
      - "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  telemetry-poller:
    image: curlimages/curl:latest
    depends_on:
      - aether-engine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        echo "Starting telemetry poller..."
        while true; do
          NOW=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for link in leo_01 lte_01; do
            curl -s -X POST http://aether-engine:8080/api/v1/telemetry \
              -H "Content-Type: application/json" \
              -d "{\"link_id\":\"$$link\",\"state\":{\"link_id\":\"$$link\",\"latency_ms\":50.0,\"availability\":\"up\",\"timestamp\":\"$$NOW\",\"source_id\":\"poller\"},\"received_at\":\"$$NOW\"}" || true
          done
          sleep 10
        done

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aether
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - loki

volumes:
  loki-data:
  grafana-data:
